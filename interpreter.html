<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>即時口譯</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="口譯">
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
    --me:#0e7490; --them:#334155; --accent:#22d3ee; --danger:#ef4444; --ok:#22c55e;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}  /* iOS Safari 會自動放大小字，關掉 */
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  body{display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0}
  .iconbtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 12px;font-size:15px}
  #settings{background:var(--panel);padding:14px 16px;border-bottom:1px solid var(--line);display:none}
  #settings.open{display:block}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--text)}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px;color:var(--text)}
  .check input{width:auto}
  .note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
  .note a{color:var(--accent)}
  #log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
  .empty{color:var(--muted);text-align:center;margin-top:30%;line-height:1.8;font-size:15px}
  .msg{max-width:88%;padding:10px 12px;border-radius:14px;cursor:pointer}
  .msg.me{align-self:flex-end;background:var(--me)}
  .msg.them{align-self:flex-start;background:var(--them)}
  .msg .who{font-size:11px;opacity:.7;margin-bottom:2px}
  .msg .orig{font-size:calc(13px * var(--fs, 1));opacity:.75;margin-bottom:4px}
  .msg .trans{font-size:calc(19px * var(--fs, 1));line-height:1.45}
  .msg.live .trans::after{content:" ▍";opacity:.6}
  footer{padding:12px 16px 16px;border-top:1px solid var(--line)}
  #status{font-size:13px;color:var(--muted);margin-bottom:10px;min-height:18px;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.err{background:var(--danger)}
  .dot.speak{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  #main{width:100%;font-size:20px;font-weight:600;padding:16px;border:none;border-radius:16px;
    background:var(--accent);color:#082f49}
  #main.stop{background:var(--danger);color:#fff}
  .tools{display:flex;gap:8px;margin-top:10px}
  .tools button{flex:1;padding:8px 4px;font-size:14px;white-space:nowrap}
  .tools button.narrow{flex:0 0 48px}
  #ptt{display:none;gap:10px;margin-bottom:10px}
  #ptt.show{display:flex}
  #ptt button{flex:1;min-height:76px;border-radius:16px;border:2px solid var(--accent);background:var(--panel);color:var(--text);
    font-size:17px;font-weight:600;line-height:1.3;padding:8px;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;touch-action:none}
  #ptt button b{display:block;font-size:18px}
  #ptt button small{display:block;font-size:13px;font-weight:400;opacity:.8;margin-top:2px}
  #ptt button#pttThem{border-color:#94a3b8}
  #ptt button.active{background:var(--accent);color:#082f49;transform:scale(.98)}
  #ptt button#pttThem.active{background:#cbd5e1}
  .langrow{display:flex;gap:8px;align-items:flex-end}
  .langrow>div{flex:1;min-width:0}
  #swapLang{flex:none;height:44px;width:44px;padding:0;font-size:20px}
  #overlay{position:fixed;inset:0;background:#fff;color:#000;display:none;align-items:center;justify-content:center;
    padding:24px;font-size:calc(34px * var(--fs, 1));line-height:1.5;text-align:center;z-index:10;overflow-y:auto}
  #overlay.open{display:flex}
  #overlay small{position:absolute;bottom:24px;left:0;right:0;font-size:14px;color:#666}
  /* 除錯模式（網址加 #debug） */
  /* 預設收合成一條細列，不擋住字幕；點一下才展開 */
  #debug{display:none;flex:none;border-top:1px solid var(--line);background:#020617}
  #debug.open{display:block}
  #debug .bar{display:flex;gap:6px;align-items:center;padding:4px 10px;font-size:12px;color:var(--muted)}
  #debugToggle{flex:1;min-width:0;text-align:left;background:none;border:none;color:inherit;font-size:12px;padding:4px 0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #debugToggle.has-err{color:#fca5a5}
  #debug .bar .iconbtn{padding:2px 8px;font-size:12px;border-radius:8px}
  #debug:not(.expanded) .bar .iconbtn{display:none}
  #debugLog{display:none;margin:0;padding:4px 10px 6px;max-height:25vh;overflow:auto;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;
    white-space:pre-wrap;word-break:break-all;color:#cbd5e1}
  #debug.expanded #debugLog{display:block}
  #debugLog .in{color:#a5f3fc}#debugLog .out{color:#fde68a}#debugLog .err{color:#fca5a5}
</style>
</head>
<body>
<header>
  <h1>🎧 即時口譯</h1>
  <button class="iconbtn" id="toggleSettings">⚙️ 設定</button>
</header>

<section id="settings">
  <label for="apiKey">Gemini API Key（只存在這支手機）</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="貼上 AI Studio 的 API key">
  <div class="langrow">
    <div>
      <label for="langMe">我的語言</label>
      <select id="langMe"></select>
    </div>
    <button class="iconbtn" id="swapLang" title="對調我的語言和對方語言" aria-label="對調語言">⇄</button>
    <div>
      <label for="langOther">對方語言</label>
      <select id="langOther"></select>
    </div>
  </div>
  <label for="mode">翻譯方向</label>
  <select id="mode">
    <option value="both">雙向自動（偵測誰在說話）</option>
    <option value="toOther">只翻成對方語言</option>
    <option value="toMe">只翻成我的語言</option>
  </select>
  <label for="input">收音方式</label>
  <select id="input">
    <option value="auto">自動（一直聽，自動判斷誰在說話）</option>
    <option value="ptt">按住說話（吵雜環境用，按鈕決定誰在說話）</option>
  </select>
  <label class="check"><input type="checkbox" id="speak" checked> 播放翻譯語音（關掉就只看字幕）</label>
  <label for="wait">翻譯語音什麼時候播</label>
  <select id="wait">
    <option value="0">即時（邊說邊播，最快但會打斷說話的人）</option>
    <option value="700">說完停 0.7 秒後播</option>
    <option value="1200">說完停 1.2 秒後播（建議）</option>
    <option value="2000">說完停 2 秒後播（說話常停頓的人）</option>
  </select>
  <label for="autoPause">沒人說話多久自動暫停（省免費額度，有人說話會自動恢復）</label>
  <select id="autoPause">
    <option value="0">不要自動暫停</option>
    <option value="60000">1 分鐘（建議）</option>
    <option value="120000">2 分鐘</option>
    <option value="300000">5 分鐘</option>
  </select>
  <label for="model">模型名稱（進階，通常不用改）</label>
  <input id="model" type="text" autocomplete="off">
  <p class="note">
    API key 在 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 免費申請。
    依 Google 條款，免費方案的內容可能會被用來改善 Google 的產品，所以請不要用來翻譯可辨識病人身分的資訊。<br>
    字幕會邊說邊出現；語音預設等說話的人停下來才播。播放語音時會暫停收音，避免翻譯聲又被麥克風收進去。
  </p>
</section>

<main id="log"><div class="empty" id="empty">按下「開始口譯」，對著手機說話<br>點一下翻譯泡泡可以放大給對方看</div></main>

<section id="debug">
  <div class="bar"><button id="debugToggle">▸ 除錯紀錄（0）</button>
    <button class="iconbtn" id="debugCopy">複製</button><button class="iconbtn" id="debugClear">清除</button></div>
  <pre id="debugLog"></pre>
</section>

<footer>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">尚未開始</span></div>
  <div id="ptt">
    <button id="pttMe">按住：我說</button>
    <button id="pttThem">按住：對方說</button>
  </div>
  <button id="main">開始口譯</button>
  <div class="tools">
    <button class="iconbtn narrow" id="fontDown" title="字小一點" aria-label="字小一點">A−</button>
    <button class="iconbtn narrow" id="fontUp" title="字大一點" aria-label="字大一點">A＋</button>
    <button class="iconbtn" id="copyLog">複製紀錄</button>
    <button class="iconbtn" id="clear">清除紀錄</button>
  </div>
</footer>

<div id="overlay"><div id="overlayText"></div><small>點一下關閉</small></div>

<script>
(() => {
  'use strict';

  const DEFAULT_MODEL = 'gemini-3.5-live-translate-preview';
  const WS_BASE = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent';
  // 常用語言（診所常見的外籍病患）排在選單最上面
  const LANGS_COMMON = [
    ['zh-Hant','繁體中文'],['en','英文'],['vi','越南文'],['id','印尼文'],['th','泰文'],['fil','菲律賓文'],['ja','日文']
  ];
  const LANGS_OTHER = [
    ['ko','韓文'],['ms','馬來文'],['my','緬甸文'],['km','高棉文'],['hi','印地文'],['es','西班牙文'],['fr','法文'],
    ['de','德文'],['ru','俄文'],['ar','阿拉伯文'],['pt-BR','葡萄牙文（巴西）'],['zh-Hans','簡體中文']
  ];
  const LANGS = LANGS_COMMON.concat(LANGS_OTHER);
  const langName = c => (LANGS.find(l => l[0] === c) || [c, c])[1];

  const $ = id => document.getElementById(id);
  const el = {
    settings:$('settings'), apiKey:$('apiKey'), langMe:$('langMe'), langOther:$('langOther'),
    mode:$('mode'), input:$('input'), speak:$('speak'), wait:$('wait'), autoPause:$('autoPause'), model:$('model'), log:$('log'), empty:$('empty'),
    dot:$('dot'), statusText:$('statusText'), main:$('main'), overlay:$('overlay'), overlayText:$('overlayText')
  };

  // ---------- 設定（存在本機） ----------
  const store = {
    get(k, d){ try { const v = localStorage.getItem('interp.' + k); return v === null ? d : v; } catch { return d; } },
    set(k, v){ try { localStorage.setItem('interp.' + k, v); } catch {} }
  };
  for (const sel of [el.langMe, el.langOther]) {
    for (const [label, list] of [['常用', LANGS_COMMON], ['其他語言', LANGS_OTHER]]) {
      const g = document.createElement('optgroup'); g.label = label;
      for (const [code, name] of list) g.appendChild(new Option(name, code));
      sel.appendChild(g);
    }
  }
  el.apiKey.value = store.get('key', '');
  el.langMe.value = store.get('me', 'zh-Hant');
  el.langOther.value = store.get('other', 'en');
  el.mode.value = store.get('mode', 'both');
  el.speak.checked = store.get('speak', '1') === '1';
  el.model.value = store.get('model', DEFAULT_MODEL);
  el.apiKey.onchange = () => store.set('key', el.apiKey.value.trim());
  el.langMe.onchange = () => store.set('me', el.langMe.value);
  el.langOther.onchange = () => store.set('other', el.langOther.value);
  el.mode.onchange = () => store.set('mode', el.mode.value);
  el.input.value = store.get('input', 'auto');
  if (!el.input.value) el.input.value = 'auto';
  el.input.onchange = () => store.set('input', el.input.value);
  el.speak.onchange = () => store.set('speak', el.speak.checked ? '1' : '0');
  el.wait.value = store.get('wait', '1200');
  if (!el.wait.value) el.wait.value = '1200';
  el.wait.onchange = () => store.set('wait', el.wait.value);
  el.autoPause.value = store.get('autoPause', '60000');
  if (!el.autoPause.value) el.autoPause.value = '60000';
  el.autoPause.onchange = () => store.set('autoPause', el.autoPause.value);
  el.model.onchange = () => store.set('model', el.model.value.trim() || DEFAULT_MODEL);
  if (!el.apiKey.value) el.settings.classList.add('open');
  $('toggleSettings').onclick = () => el.settings.classList.toggle('open');

  function setStatus(text, kind){
    if (S.pttMode && S.running && text === '聆聽中…請說話') text = '準備好了：按住下方按鈕說話';
    if (el.statusText.textContent === text && el.dot.className === 'dot' + (kind ? ' ' + kind : '')) return;
    el.statusText.textContent = text;
    el.dot.className = 'dot' + (kind ? ' ' + kind : '');
    dbg('sys', '[狀態] ' + text);
  }

  // ---------- 除錯模式：網址帶 #debug 時顯示原始 server 訊息 ----------
  const debugBox = $('debug'), debugLog = $('debugLog');
  const DEBUG_MAX = 400;          // 最多保留幾行，避免長時間使用拖慢手機
  const isDebug = () => /(^|[#&])debug\b/.test(location.hash.slice(1));
  const syncDebug = () => debugBox.classList.toggle('open', isDebug());
  window.addEventListener('hashchange', syncDebug);
  syncDebug();
  // 把音訊 base64 換成長度摘要，畫面才看得懂
  const shrink = (k, v) => (typeof v === 'string' && v.length > 200 && /data$/i.test(k)) ? `<base64 ${v.length} 字元>` : v;
  function dbg(kind, tag, obj){
    if (!isDebug()) return;
    const t = new Date();
    const ts = t.toTimeString().slice(0, 8) + '.' + String(t.getMilliseconds()).padStart(3, '0');
    const line = document.createElement('div');
    line.className = kind;
    line.textContent = ts + ' ' + tag + (obj === undefined ? '' : ' ' + (typeof obj === 'string' ? obj : JSON.stringify(obj, shrink)));
    const atBottom = debugLog.scrollTop + debugLog.clientHeight >= debugLog.scrollHeight - 20;
    debugLog.appendChild(line);
    while (debugLog.childNodes.length > DEBUG_MAX) debugLog.firstChild.remove();
    if (atBottom) debugLog.scrollTop = debugLog.scrollHeight;
    debugCount++;
    if (kind === 'err') { lastErr = line.textContent.slice(13, 90); }
    updateDebugBar();
  }
  // 收合時的細列：顯示筆數和最新一則錯誤，不用展開也知道有沒有出事
  let debugCount = 0, lastErr = '';
  const debugToggle = $('debugToggle');
  function updateDebugBar(){
    const open = debugBox.classList.contains('expanded');
    debugToggle.textContent = (open ? '▾ ' : '▸ ') + '除錯紀錄（' + debugCount + '）' + (lastErr && !open ? '　✕ ' + lastErr : '');
    debugToggle.classList.toggle('has-err', !!lastErr && !open);
  }
  debugToggle.onclick = () => {
    const open = debugBox.classList.toggle('expanded');
    if (open) { lastErr = ''; debugLog.scrollTop = debugLog.scrollHeight; }
    updateDebugBar();
  };
  $('debugClear').onclick = () => { debugLog.textContent = ''; debugCount = 0; lastErr = ''; updateDebugBar(); };
  $('debugCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(debugLog.innerText); dbg('sys', '[已複製到剪貼簿]'); }
    catch (e) { dbg('err', '[複製失敗] ' + (e && e.message || e)); }
  };

  // ---------- 狀態 ----------
  const S = {
    running:false, sessions:[], ctx:null, stream:null, source:null, node:null, sink:null,
    nextPlay:0, playUntil:0, silentRun:0, playOwner:null, waitLogged:false, lastVoice:0, noise:0, wakeLock:null,
    paused:false, preroll:[], lastOut:0, startedAt:0
  };

  // ---------- 工具 ----------
  function int16ToBase64(int16){
    const bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }
  function base64ToInt16(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Int16Array(bytes.buffer, 0, bytes.length >> 1);
  }

  // ---------- 播放翻譯語音（24kHz PCM16） ----------
  // 實測：每包固定 250ms；開頭會一次先送 2～3 包（約 500ms 的提前量），之後約每 250ms 一包。
  // 講完第一句後，伺服器會一直送音訊包，安靜時內容是靜音（peak < 0.005），人聲包 peak > 0.05。
  // - 句子中間的靜音包要照排，不然每丟一包就吃掉 250ms 提前量，之後只要晚到就斷斷續續、有爆音。
  // - 但連續靜音超過 MAX_SILENT_RUN 包就停止排入，否則播放永遠不會結束、麥克風一直被換成靜音。
  // - 從閒置開始播放時先延後 START_DELAY 秒，當作網路抖動的緩衝。
  const SILENT_PEAK = 0.02 * 32768;
  const MAX_SILENT_RUN = 3;       // 最多 750ms 的句中停頓
  const START_DELAY = 0.3;
  function isAudible(pcm){
    for (let i = 0; i < pcm.length; i++) if (pcm[i] > SILENT_PEAK || pcm[i] < -SILENT_PEAK) return true;
    return false;
  }
  // ---------- 說話偵測：用麥克風音量判斷「還有人在說話」 ----------
  // 模型是同步口譯，會邊聽邊翻。如果翻譯語音馬上播，麥克風就會被換成靜音（避免回授），
  // 說話的人後半句會被吃掉。所以預設先把翻譯語音暫存，等麥克風安靜超過設定時間才播。
  // 噪音底線：從 NOISE_INIT 開始（不能用第一包的音量，一開口就說話的話，說話聲會被當成噪音），
  // 變小時很快跟上，變大時很慢（約 50 秒），上限 NOISE_MAX。門檻＝底線 × 2.5，至少 VOICE_MIN。
  const VOICE_MIN = 0.01, NOISE_INIT = 0.003, NOISE_MAX = 0.04;
  function trackVoice(int16){
    let sq = 0;
    for (let i = 0; i < int16.length; i++) { const v = int16[i] / 32768; sq += v * v; }
    const rms = Math.sqrt(sq / int16.length);
    const n = S.noise || NOISE_INIT;
    S.noise = Math.min(NOISE_MAX, rms < n ? n * 0.7 + rms * 0.3 : n * 0.998 + rms * 0.002);
    if (rms > Math.max(VOICE_MIN, S.noise * 2.5)) S.lastVoice = performance.now();
  }
  const waitMs = () => Number(el.wait.value) || 0;
  const userSpeaking = () => waitMs() > 0 && performance.now() - S.lastVoice < waitMs();
  const NEW_SENTENCE_GAP = 2000;  // 同一條連線超過 2 秒沒有新原文 → 當作新的一句
  const QUEUE_MAX = 240;          // 每條連線最多暫存 60 秒

  // ---------- 播放排程：每條連線各自一個佇列，同一時間只播一條，絕不交錯 ----------
  // 實測：換語言時，上一句的翻譯（例如英文連線）和下一句的翻譯（繁中連線）可能同時在送。
  // 以前共用一個佇列，會變成 250ms 中文、250ms 英文交錯播出，聽起來就是中英夾雜加雜訊。
  // owner：送來這包的連線。回傳 true 代表這包是有聲音的翻譯語音
  function playPcm(b64, owner){
    const pcm = base64ToInt16(b64);
    if (!pcm.length) return false;
    const audible = isAudible(pcm);
    if (!el.speak.checked || !S.ctx) return audible;
    // 靜音包只有在這條連線正在播、或已經有暫存時才收（保住句中停頓的時間軸）
    if (audible || owner.q.length || owner === S.playOwner) {
      owner.q.push({ pcm, audible, at: performance.now(), turn: owner.turnId });
      if (owner.q.length > QUEUE_MAX) owner.q.shift();
    }
    pump();
    return audible;
  }

  // 把佇列裡的語音排進播放時間軸。每收到一包語音、以及麥克風每 100ms 都會呼叫一次。
  function pump(){
    if (!S.ctx || !el.speak.checked) return;
    const idle = S.nextPlay <= S.ctx.currentTime;
    if (!idle) {
      // 正在播：只接著排同一條連線的語音，其他連線排隊等這段播完
      const o = S.playOwner;
      if (o && o.q.length) drain(o, START_DELAY);
      return;
    }
    for (const s of S.sessions) while (s.q.length && !s.q[0].audible) s.q.shift();   // 開頭的靜音不要
    const ready = S.sessions.filter(s => s.q.length);
    if (!ready.length) return;
    if (userSpeaking()) {                   // 還有人在說話 → 先暫存，等說完
      if (!S.waitLogged) { S.waitLogged = true; dbg('sys', '[播放] 還有人在說話，翻譯語音先暫存'); }
      return;
    }
    S.waitLogged = false;
    // 目前這條連線優先，否則選最早有語音的那條
    const o = ready.includes(S.playOwner) ? S.playOwner : ready.sort((a, b) => a.q[0].at - b.q[0].at)[0];
    if (o !== S.playOwner) S.silentRun = 0;
    const n = o.q.length;
    if (n > 2) dbg('sys', '[播放] 開始播放 ' + o.tag + ' 暫存的 ' + n + ' 包（' + (n / 4).toFixed(1) + ' 秒）'
      + (ready.length > 1 ? '，另一條連線排隊等' : ''));
    S.playOwner = o;
    drain(o, n > 2 ? 0.1 : START_DELAY);    // 已經暫存好幾包就不必再加緩衝
  }
  function drain(o, startDelay){
    const items = o.q; o.q = [];
    for (const it of items) schedule(it.pcm, it.audible, o, startDelay, it.turn);
  }

  // 把一包語音排進播放時間軸（處理句中靜音和緩衝）
  function schedule(pcm, audible, owner, startDelay, turn){
    const now = S.ctx.currentTime;
    const idle = S.nextPlay <= now;
    if (!audible) {
      // 只有「正在播放的那條連線」的句中靜音才排入，另一條連線的靜音不能插進來
      if (idle || owner !== S.playOwner || S.silentRun >= MAX_SILENT_RUN) return;
      S.silentRun++;
    } else {
      // 句子還沒結束（不是因為句尾靜音而停）卻已經播完 → 網路晚到造成斷音
      if (idle && startDelay === START_DELAY && S.nextPlay > 0 && now - S.nextPlay < 1 && S.silentRun < MAX_SILENT_RUN) {
        dbg('err', '[播放] 緩衝用完，語音晚到 ' + Math.round((now - S.nextPlay) * 1000) + 'ms（會聽到斷音）');
      }
      S.silentRun = 0;
      S.playOwner = owner;
    }
    const buf = S.ctx.createBuffer(1, pcm.length, 24000);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
    const src = S.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(S.ctx.destination);
    const t = idle ? now + startDelay : S.nextPlay;
    src.start(t);
    // 記下來：之後如果發現這句其實是照念原文，還能把已經排定的語音停掉
    const rec = { src, turn };
    owner.srcs.push(rec);
    src.onended = () => { const i = owner.srcs.indexOf(rec); if (i >= 0) owner.srcs.splice(i, 1); };
    S.nextPlay = t + buf.duration;
    if (audible) S.playUntil = S.nextPlay;   // 只有真的有聲音才延長「播放中」（決定麥克風要不要換成靜音）
  }

  // 語言代碼取主要部分來比較：zh-Hant / zh-Hans / zh 都算 zh
  const LANG_ALIAS = { tl:'fil', in:'id', iw:'he', nb:'no', nn:'no' };
  const baseLang = c => { const b = String(c || '').toLowerCase().split(/[-_]/)[0]; return LANG_ALIAS[b] || b; };

  // ---------- 判斷輸入是哪一種語言 ----------
  // iPhone 實測（2026-11-06）：同一句英文，翻成繁中的連線回報 languageCode "en"（對），
  // 翻成英文的連線卻回報 "zh"（錯），結果英文連線把英文原句又念一次。所以不能只信 languageCode。
  // 做法：兩邊語言的書寫系統不同時（中文漢字 vs 英文拉丁字母…），直接看原文逐字稿的文字判斷。
  const SCRIPTS = [
    ['Kana', /[\p{Script=Hiragana}\p{Script=Katakana}]/u], ['Han', /\p{Script=Han}/u], ['Hangul', /\p{Script=Hangul}/u],
    ['Thai', /\p{Script=Thai}/u], ['Cyrillic', /\p{Script=Cyrillic}/u], ['Arabic', /\p{Script=Arabic}/u],
    ['Devanagari', /\p{Script=Devanagari}/u], ['Myanmar', /\p{Script=Myanmar}/u], ['Khmer', /\p{Script=Khmer}/u],
    ['Latin', /\p{Script=Latin}/u]
  ];
  const LANG_SCRIPT = { zh:'Han', ja:'Kana', ko:'Hangul', th:'Thai', ru:'Cyrillic', uk:'Cyrillic', ar:'Arabic', fa:'Arabic',
    ur:'Arabic', hi:'Devanagari', mr:'Devanagari', ne:'Devanagari', my:'Myanmar', km:'Khmer' };
  const langScript = code => LANG_SCRIPT[baseLang(code)] || 'Latin';
  function dominantScript(text){
    const n = {}; let total = 0;
    for (const ch of text) {
      for (const [name, re] of SCRIPTS) if (re.test(ch)) { n[name] = (n[name] || 0) + 1; total++; break; }
    }
    if (total < 2) return '';
    if (n.Kana) return 'Kana';                         // 有假名就是日文（日文也有漢字）
    return Object.keys(n).sort((a, b) => n[b] - n[a])[0];
  }
  // 回傳判斷出的語言代碼；回傳 null 代表這段文字判斷不出來（維持原判斷）。
  // 兩邊書寫系統相同（例如英文 ↔ 印尼文）時才用伺服器給的 languageCode。
  function detectInputLang(text, serverCode){
    const me = S.langMe, other = S.langOther;
    const sMe = langScript(me), sOther = langScript(other);
    if (sMe === sOther) return serverCode || null;
    let d = dominantScript(text);
    if (d === 'Han' && (sMe === 'Kana' || sOther === 'Kana') && sMe !== 'Han' && sOther !== 'Han') d = 'Kana';
    if (d === sMe) return me;
    if (d === sOther) return other;
    return null;   // 太短（例如只有 " I"）或是第三種文字：不要被伺服器可能錯的代碼拉走
  }
  // 譯文和原文幾乎一樣 → 是照念原文，不是翻譯（給兩邊都是拉丁字母的語言組合當備援）
  const textTokens = s => String(s).toLowerCase().match(/\p{Script=Han}|[\p{L}\p{N}]+/gu) || [];
  function looksLikeEcho(input, output){
    const out = textTokens(output);
    if (out.length < 3) return false;
    const inSet = new Set(textTokens(input));
    let hit = 0;
    for (const t of out) if (inSet.has(t)) hit++;
    return hit / out.length >= 0.6;
  }
  const isPlaying = () => S.ctx && S.ctx.currentTime < S.playUntil + 0.3;

  // ---------- 對話泡泡 ----------
  function newBubble(role){
    if (el.empty) { el.empty.remove(); el.empty = null; }
    const div = document.createElement('div');
    div.className = 'msg live ' + (role === 'toOther' ? 'me' : 'them');
    div.innerHTML = '<div class="who"></div><div class="orig"></div><div class="trans"></div>';
    div.querySelector('.who').textContent = role === 'toOther'
      ? '我 → ' + langName(S.langOther || el.langOther.value)
      : '對方 → ' + langName(S.langMe || el.langMe.value);
    div.dataset.time = new Date().toTimeString().slice(0, 8);
    div.onclick = () => {
      el.overlayText.textContent = div.querySelector('.trans').textContent;
      el.overlay.classList.add('open');
    };
    el.log.appendChild(div);
    return div;
  }
  function scrollDown(){ el.log.scrollTop = el.log.scrollHeight; }
  el.overlay.onclick = () => el.overlay.classList.remove('open');
  $('clear').onclick = () => {
    if (el.log.querySelector('.msg') && !confirm('確定要清除所有對話紀錄嗎？')) return;
    el.log.innerHTML = '';
    for (const s of S.sessions) s.resetTurn();
  };

  // ---------- 字幕字級（長輩病患需要大字），存在本機 ----------
  const FONT_STEPS = [0.8, 1, 1.2, 1.4, 1.7, 2];
  let fontIdx = Math.max(0, FONT_STEPS.indexOf(Number(store.get('fs', '1'))));
  if (FONT_STEPS[fontIdx] === undefined) fontIdx = 1;
  function applyFont(){
    document.documentElement.style.setProperty('--fs', FONT_STEPS[fontIdx]);
    store.set('fs', String(FONT_STEPS[fontIdx]));
    $('fontDown').disabled = fontIdx === 0;
    $('fontUp').disabled = fontIdx === FONT_STEPS.length - 1;
  }
  $('fontDown').onclick = () => { if (fontIdx > 0) { fontIdx--; applyFont(); scrollDown(); } };
  $('fontUp').onclick = () => { if (fontIdx < FONT_STEPS.length - 1) { fontIdx++; applyFont(); scrollDown(); } };
  applyFont();

  // ---------- 複製全部紀錄：只放進剪貼簿，不會送到任何伺服器 ----------
  $('copyLog').onclick = async () => {
    const lines = [...el.log.querySelectorAll('.msg')].map(m => {
      const who = m.querySelector('.who').textContent;
      const orig = m.querySelector('.orig').textContent.trim();
      const trans = m.querySelector('.trans').textContent.trim();
      return ['[' + (m.dataset.time || '') + '] ' + who, '原文：' + orig, '翻譯：' + trans].join('\n');
    });
    if (!lines.length) { setStatus('還沒有對話紀錄可以複製'); return; }
    const text = '即時口譯紀錄 ' + new Date().toLocaleDateString('zh-TW') + '\n\n' + lines.join('\n\n');
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // 舊瀏覽器備援
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    setStatus('已複製 ' + lines.length + ' 則對話到剪貼簿（不會上傳）', S.running ? 'on' : '');
  };

  // ---------- 一鍵對調「我的語言」和「對方語言」 ----------
  $('swapLang').onclick = async () => {
    const a = el.langMe.value; el.langMe.value = el.langOther.value; el.langOther.value = a;
    store.set('me', el.langMe.value); store.set('other', el.langOther.value);
    if (S.running) { stop(true); setStatus('語言已對調，重新連線中…'); await start(); }
    else setStatus('已對調：我的語言＝' + langName(el.langMe.value) + '，對方語言＝' + langName(el.langOther.value));
  };

  // ---------- 連線錯誤：翻成中文，並判斷要不要重試 ----------
  // 實測過的：無效 key → 1007 "API key not valid"；預付額度用完 → 1011 "prepayment credits are depleted"；
  // 設定格式錯 → 1007 "Invalid JSON payload"；接續 handle 失效 → 1008 "session not found"（可改開新連線，不算致命）。
  function explainClose(code, reason){
    const r = reason || '';
    const fatal = msg => ({ fatal: true, msg });
    if (/session not found/i.test(r)) return { fatal: false, resetHandle: true, msg: '接續失敗，改開新連線' };
    if (/API key not valid|API_KEY_INVALID|API key expired/i.test(r)) return fatal('API key 無效或已過期，請到「設定」重新貼上正確的 key');
    if (/prepayment|credits are depleted|billing/i.test(r))
      return fatal('這把 key 所屬的專案綁了付費帳單，而且預付額度用完了。請改用「沒有綁帳單」的專案建立的 key（免費方案）');
    if (/quota|RESOURCE_EXHAUSTED|rate limit|too many requests|exceeded/i.test(r))
      return fatal('免費額度用完，或短時間內使用太頻繁。每分鐘的限制等一下就恢復；每日額度在台灣時間下午 3～4 點重置。'
        + '「雙向自動」會同時用 2 條連線，改用單向模式（只翻成對方語言／只翻成我的語言）可以省一半額度');
    if (/permission|PERMISSION_DENIED|has not been used|is disabled|forbidden/i.test(r))
      return fatal('這把 key 沒有使用權限（可能專案沒有啟用 Gemini API），請到 AI Studio 重新建立 key');
    if (/location|region|country/i.test(r)) return fatal('目前所在地區無法使用這個服務');
    if (/not found|is not supported|unsupported model/i.test(r))
      return fatal('找不到模型「' + (el.model.value.trim() || DEFAULT_MODEL) + '」，請到「設定」檢查模型名稱（通常不用改）');
    if (/Invalid JSON|Unknown name|Cannot find field|invalid argument/i.test(r))
      return fatal('伺服器不接受 app 送出的設定（程式可能需要更新）：' + r);
    if (!navigator.onLine) return { fatal: false, offline: true, msg: '網路斷線' };
    if (code === 1006 || !r) return { fatal: false, msg: '連線中斷' };
    return { fatal: false, msg: '連線中斷（' + r + '）' };
  }
  const RETRY_DELAYS = [1000, 2000, 4000, 8000, 15000];   // 最多重試 5 次

  // ---------- 一條 Live 翻譯連線 ----------
  // 連線時間：官方文件說純音訊 session 上限 15 分鐘、單一連線約 10 分鐘。
  // 對策（實測翻譯模型可用，欄位要放 setup 頂層）：
  // - contextWindowCompression: { slidingWindow: {} } → 解除 session 時間上限
  // - sessionResumption → 伺服器會發 handle（有語音內容時約每 1～2 秒一個），換線時帶上就能接續
  // - 收到 goAway 時先開新連線，新連線 setupComplete 前音訊繼續送舊連線，準備好才切換（無縫換線）
  class Session {
    constructor(role, target){
      this.role = role;          // 'toOther'：我說話；'toMe'：對方說話
      this.target = target;
      this.tag = '[→' + target + ']';
      this.ws = null;            // 正在使用的連線
      this.next = null;          // 換線中：還沒準備好的新連線
      this.ready = false; this.retry = 0; this.retryTimer = null;
      this.resumeHandle = null;  // 最新的 session resumption handle
      this.inText = ''; this.outText = ''; this.bubble = null; this.idle = null;
      this.inLang = '';          // 最近一次 inputTranscription 的 languageCode
      this.lastInAt = 0;         // 最近一次收到原文逐字稿的時間
      this.turnId = 0;           // 第幾句（語音和泡泡都標上，方便整句丟掉）
      this.echoTurn = false;     // 這一句被判定為照念原文
      this.srcs = [];            // 已排進播放的語音（可以停掉）
      this.q = [];               // 這條連線還沒排進播放的語音
      this.open(false);
    }
    // swap=true：換線（舊連線繼續用到新連線準備好）；false：第一次連線或斷線重連
    open(swap){
      const key = el.apiKey.value.trim();
      const model = el.model.value.trim() || DEFAULT_MODEL;
      const tag = this.tag;
      const handle = this.resumeHandle;
      dbg('sys', tag + (swap ? ' 換線：開新連線' : ' 連線中') + (handle ? '（帶接續 handle）' : '') + '（key 不顯示）');
      const ws = new WebSocket(WS_BASE + '?key=' + encodeURIComponent(key));
      ws.openedAt = performance.now();
      if (swap) this.next = ws; else { this.ws = ws; this.ready = false; }
      ws.onopen = () => {
        // 實測（2026-11-06）：*AudioTranscription、contextWindowCompression、sessionResumption 都必須放在 setup 頂層，
        // 放進 generationConfig 會被 1007 拒絕；translationConfig 則必須在 generationConfig 裡。
        const setup = {
          setup: {
            model: 'models/' + model,
            generationConfig: {
              responseModalities: ['AUDIO'],
              translationConfig: { targetLanguageCode: this.target, echoTargetLanguage: false }
            },
            inputAudioTranscription: {},
            outputAudioTranscription: {},
            contextWindowCompression: { slidingWindow: {} },
            sessionResumption: handle ? { handle } : {}
          }
        };
        dbg('out', tag + ' → open，送出 setup', setup);
        ws.send(JSON.stringify(setup));
      };
      ws.onmessage = async ev => {
        let text = ev.data;
        if (typeof text !== 'string') text = await (text.text ? text.text() : new Response(text).text());
        let msg; try { msg = JSON.parse(text); } catch { dbg('err', tag + ' ← 非 JSON 訊息', text.slice(0, 300)); return; }
        dbg('in', tag + ' ←', msg);
        this.onMessage(ws, msg);
      };
      ws.onerror = () => { dbg('err', tag + ' ✕ WebSocket error 事件（瀏覽器不提供細節，請看下一行的 close）'); };
      ws.onclose = ev => this.onClose(ws, ev);
    }
    onMessage(ws, msg){
      if (msg.setupComplete) {
        if (ws === this.next) {                 // 換線完成：切到新連線，舊連線留 3 秒收完還在路上的翻譯
          const old = this.ws;
          this.ws = ws; this.next = null;
          if (old) { old.retiring = true; setTimeout(() => { try { old.close(); } catch {} }, 3000); }
          dbg('sys', this.tag + ' 換線完成');
        }
        if (ws === this.ws) {
          this.ready = true; this.retry = 0;
          // 自動暫停恢復時：先補送暫停期間保留的錄音（加上連線中這段時間的錄音），第一句開頭才不會漏掉
          if (this.preroll && this.preroll.length) {
            const pre = this.preroll; this.preroll = null;
            for (const b64 of pre) this.send(b64);
            dbg('sys', this.tag + ' 已補送 ' + (pre.length / 10).toFixed(1) + ' 秒的錄音');
          }
          this.preroll = null;
          if (S.sessions.every(s => s.ready)) setStatus('聆聽中…請說話', 'on');
        }
        return;
      }
      if (msg.sessionResumptionUpdate) {
        const u = msg.sessionResumptionUpdate;
        if (ws === this.ws && u.resumable !== false && u.newHandle) this.resumeHandle = u.newHandle;
      }
      if (msg.goAway) {                         // 伺服器即將結束這條連線 → 無縫換線
        dbg('sys', this.tag + ' 收到 goAway（剩 ' + (msg.goAway.timeLeft || '?') + '），這條連線用了 '
          + Math.round((performance.now() - ws.openedAt) / 1000) + ' 秒');
        if (ws === this.ws && !this.next && S.running) this.open(true);
        return;
      }
      if (ws === this.ws || ws.retiring) this.handle(msg);
    }
    onClose(ws, ev){
      dbg('err', this.tag + ' ✕ close', { code: ev.code, reason: ev.reason, wasClean: ev.wasClean,
        active: ws === this.ws, swapping: ws === this.next, retiring: !!ws.retiring, running: S.running });
      if (ws.retiring || !S.running) return;
      if (ws !== this.ws && ws !== this.next) return;
      const why = explainClose(ev.code, ev.reason);
      if (why.fatal) { setStatus(why.msg, 'err'); stop(true); return; }
      if (why.resetHandle) this.resumeHandle = null;
      if (ws === this.next) {                   // 換線失敗：舊連線還能用，稍後再換
        this.next = null;
        setTimeout(() => { if (S.running && !this.next && this.ws && this.ws.readyState === 1) this.open(true); }, 1000);
        return;
      }
      // 正在用的連線斷了 → 重連（有 handle 就接續）
      this.ready = false;
      if (this.next) { dbg('sys', this.tag + ' 舊連線先斷了，等新連線準備好'); return; }
      this.scheduleRetry(why);
    }
    scheduleRetry(why){
      clearTimeout(this.retryTimer);
      if (why.offline) {                        // 離線不算次數，等網路恢復
        setStatus('網路斷線，等網路恢復後會自動重新連線…', 'err');
        window.addEventListener('online', () => { if (S.running && !this.ready) this.open(false); }, { once: true });
        return;
      }
      if (this.retry >= RETRY_DELAYS.length) {
        setStatus('連線一直失敗（已重試 ' + RETRY_DELAYS.length + ' 次）：' + why.msg + '。請確認網路後再按「開始口譯」', 'err');
        stop(true);
        return;
      }
      const delay = RETRY_DELAYS[this.retry++];
      setStatus(why.msg + '，' + Math.round(delay / 1000) + ' 秒後重新連線（第 ' + this.retry + '/' + RETRY_DELAYS.length + ' 次）…', 'err');
      this.retryTimer = setTimeout(() => { if (S.running && !this.ready) this.open(false); }, delay);
    }
    handle(msg){
      const c = msg.serverContent;
      if (!c) return;
      const it = c.inputTranscription;
      if (it && it.text && it.text.trim()) {
        // 實測：每句的 inputTranscription 比翻譯語音早約 250ms 到，可以拿來判斷要不要翻
        const lang = detectInputLang(it.text, it.languageCode);
        if (lang && it.languageCode && baseLang(lang) !== baseLang(it.languageCode)) {
          dbg('sys', this.tag + ' 伺服器說原文是 ' + it.languageCode + '，但文字看起來是 ' + lang + '，以文字為準');
        }
        if (lang && baseLang(lang) !== baseLang(this.inLang)) {
          const wasEcho = this.isEcho();
          this.inLang = lang;
          if (this.isEcho()) {
            dbg('sys', this.tag + ' 輸入語言是 ' + lang + '，和目標相同，這條連線略過輸出');
            this.resetTurn();
          } else if (wasEcho) {
            this.resetTurn();                  // 換回需要翻的語言 → 新的一句
          }
        }
        if (!this.isEcho()) {
          // 超過 2 秒沒有新原文、而且這則泡泡已經有翻譯 → 是新的一句，開新泡泡，避免原文混到上一句
          const now = performance.now();
          if (this.outText && now - this.lastInAt > NEW_SENTENCE_GAP) this.resetTurn();
          this.lastInAt = now;
          this.inText += it.text;
          if (this.bubble) this.bubble.querySelector('.orig').textContent = this.inText.trim();
          this.touch();
        }
      }
      // 實測：echoTargetLanguage:false 不可靠，有時候仍會把原句（文字和語音）照念一次，所以自己過濾
      if (this.isEcho()) return;
      if (c.outputTranscription && c.outputTranscription.text && c.outputTranscription.text.trim()) {
        if (!this.bubble) this.bubble = newBubble(this.role);
        this.outText += c.outputTranscription.text;
        S.lastOut = performance.now();
        this.bubble.querySelector('.orig').textContent = this.inText.trim();
        this.bubble.querySelector('.trans').textContent = this.outText.trim();
        this.touch();
        scrollDown();
        // 備援：譯文和原文幾乎一樣 → 是照念原文。整句丟掉（泡泡、暫存和已排定的語音）
        if (looksLikeEcho(this.inText, this.outText)) {
          dbg('sys', this.tag + ' 譯文和原文幾乎一樣，判定為照念原文，這句丟掉：' + this.outText.trim().slice(0, 60));
          this.dropTurn();
          return;
        }
      }
      if (c.modelTurn && c.modelTurn.parts) {
        let audible = false;
        for (const p of c.modelTurn.parts) {
          if (p.inlineData && p.inlineData.data && playPcm(p.inlineData.data, this)) audible = true;
        }
        if (audible) {
          S.lastOut = performance.now();
          if (el.speak.checked) setStatus(this.q.length && !isPlaying() ? '翻譯好了，等說完再播…' : '播放翻譯中…', 'speak');
          this.touch();
        }
      }
      if (c.turnComplete) this.touch(600);
    }
    // 輸入已經是這條連線的目標語言（例如我說中文，而這條是翻成中文的），或這句被判定為照念原文 → 不該輸出
    isEcho(){ return this.echoTurn || (!!this.inLang && baseLang(this.inLang) === baseLang(this.target)); }
    // 這一句是照念原文：拿掉泡泡、丟掉還沒播的語音、停掉已排定的語音
    dropTurn(){
      const turn = this.turnId;
      if (this.bubble) { this.bubble.remove(); this.bubble = null; }
      this.q = this.q.filter(it => it.turn !== turn);
      let stopped = 0;
      for (const r of this.srcs.slice()) if (r.turn === turn) { try { r.src.stop(); stopped++; } catch {} }
      if (stopped && S.playOwner === this && S.ctx) { S.nextPlay = S.ctx.currentTime; S.playUntil = S.ctx.currentTime; }
      this.echoTurn = true;
    }
    // 一段時間沒有新內容，就把這則泡泡收尾
    touch(ms = 1800){
      clearTimeout(this.idle);
      this.idle = setTimeout(() => {
        // 還有人在說話、翻譯語音還在暫存或還在播 → 這句還沒完，泡泡先別收尾
        if (S.running && (this.q.length || isPlaying() || performance.now() - S.lastVoice < 1500)) { this.touch(ms); return; }
        this.resetTurn();
        if (S.running && S.sessions.every(s => s.ready)) setStatus('聆聽中…請說話', 'on');
      }, ms);
    }
    resetTurn(){
      if (this.bubble) this.bubble.classList.remove('live');
      this.bubble = null; this.inText = ''; this.outText = '';
      this.turnId++; this.echoTurn = false;
    }
    // 自動暫停：關掉連線但保留接續 handle 和其他狀態，之後用 open(false) 重連
    suspend(){
      clearTimeout(this.retryTimer);
      for (const ws of [this.ws, this.next]) { if (ws) { ws.retiring = true; try { ws.close(); } catch {} } }
      this.ws = this.next = null; this.ready = false;
      this.resetTurn();
    }
    send(b64){
      // 恢復連線中、還沒準備好 → 先存起來，連上後補送
      if (!this.ready && this.preroll) {
        this.preroll.push(b64);
        if (this.preroll.length > PREROLL_CHUNKS * 3) this.preroll.shift();
        return;
      }
      if (this.ready && this.ws && this.ws.readyState === 1) {
        this.ws.send(JSON.stringify({ realtimeInput: { audio: { data: b64, mimeType: 'audio/pcm;rate=16000' } } }));
        this.sent = (this.sent || 0) + 1;
        if (this.sent % 50 === 0) dbg('out', this.tag + ' → 已送出 ' + this.sent + ' 包音訊（每包 100ms）');
      }
    }
    close(){
      clearTimeout(this.idle); clearTimeout(this.retryTimer);
      this.resetTurn();
      this.q = [];
      for (const ws of [this.ws, this.next]) { if (ws) { ws.retiring = true; try { ws.close(); } catch {} } }
      this.ws = this.next = null; this.ready = false;
    }
  }

  // ---------- 麥克風 → 16kHz PCM16，每 100ms 一包 ----------
  const WORKLET = `
    class Down16k extends AudioWorkletProcessor {
      constructor(){ super(); this.ratio = sampleRate / 16000; this.acc = 0; this.sum = 0; this.cnt = 0;
        this.out = new Int16Array(1600); this.n = 0; }
      process(inputs){
        const ch = inputs[0] && inputs[0][0];
        if (!ch) return true;
        for (let i = 0; i < ch.length; i++) {
          this.sum += ch[i]; this.cnt++; this.acc += 1;
          if (this.acc >= this.ratio) {
            this.acc -= this.ratio;
            let v = this.sum / this.cnt; this.sum = 0; this.cnt = 0;
            v = Math.max(-1, Math.min(1, v));
            this.out[this.n++] = v < 0 ? v * 32768 : v * 32767;
            if (this.n === this.out.length) { this.port.postMessage(this.out.slice(0)); this.n = 0; }
          }
        }
        return true;
      }
    }
    registerProcessor('down16k', Down16k);`;

  // ---------- 自動暫停：一段時間沒人說話就關掉翻譯連線，省免費額度 ----------
  // 實測：即使沒人說話，每條連線還是會持續上傳和計算音訊（usageMetadata 約每 2 秒 50 token）。
  // 暫停時只關連線，麥克風繼續在手機上偵測音量（不花額度）；有人說話就自動重連（帶接續 handle）。
  // 重連約要半秒，所以暫停期間一直保留最近 PREROLL_CHUNKS 包錄音，連上後先補送，第一句開頭才不會漏掉。
  const PREROLL_CHUNKS = 20;      // 2 秒
  const autoPauseMs = () => Number(el.autoPause.value) || 0;
  function maybeAutoPause(){
    const ms = autoPauseMs();
    if (!ms || S.paused || !S.sessions.length) return;
    if (!S.sessions.every(s => s.ready)) return;                  // 連線中、換線中、重試中都先不要暫停
    if (isPlaying() || S.sessions.some(s => s.q.length)) return;  // 還有翻譯沒播完
    const now = performance.now();
    if (now - Math.max(S.lastVoice, S.lastOut, S.startedAt) < ms) return;
    S.paused = true; S.preroll = [];
    for (const s of S.sessions) s.suspend();
    dbg('sys', '[暫停] ' + (ms >= 60000 ? Math.round(ms / 60000) + ' 分鐘' : Math.round(ms / 1000) + ' 秒')
      + '沒人說話，關掉翻譯連線（麥克風繼續在手機上偵測）');
    setStatus('已自動暫停（沒人說話）。有人說話會自動恢復', '');
  }
  function resumeFromPause(){
    S.paused = false;
    S.startedAt = performance.now();
    dbg('sys', '[暫停] 偵測到有人說話，重新連線，並補送最近 ' + (S.preroll.length / 10).toFixed(1) + ' 秒的錄音');
    setStatus('有人說話，恢復連線中…');
    for (const s of S.sessions) { s.preroll = S.preroll.slice(); s.retry = 0; s.open(false); }
    S.preroll = [];
  }

  function onChunk(int16){
    if (!S.running) return;
    if (S.pttMode) return onChunkPtt(int16);
    const before = S.lastVoice;
    trackVoice(int16);          // 用真正的麥克風音量判斷有沒有人在說話（要在換成靜音之前）
    if (S.paused) {
      S.preroll.push(int16ToBase64(int16));
      if (S.preroll.length > PREROLL_CHUNKS) S.preroll.shift();
      if (S.lastVoice !== before) resumeFromPause();
      return;
    }
    pump();
    maybeAutoPause();
    if (S.paused) return;
    // 播放翻譯語音時送靜音，避免喇叭聲被收進去又翻一次
    if (el.speak.checked && isPlaying()) int16 = new Int16Array(int16.length);
    const b64 = int16ToBase64(int16);
    for (const s of S.sessions) s.send(b64);
  }

  // ---------- 按住說話（吵雜環境用） ----------
  // 兩顆按鈕直接決定翻譯方向：按住「我說」→ 麥克風只送給翻成對方語言的連線；按住「對方說」→ 只送給翻成我的語言的連線。
  // 沒按的時候兩條連線都只收到靜音，所以環境雜音不會被翻譯，也不用靠自動判斷語言。
  // 按住時一律當作「有人在說話」：翻譯語音等放開才播；按下時如果正在播，立刻停掉讓人插話。
  const SILENCE_B64 = int16ToBase64(new Int16Array(1600));
  function onChunkPtt(int16){
    if (S.ptt) S.lastVoice = performance.now();
    if (S.paused) {
      if (S.ptt) {
        S.preroll.push(int16ToBase64(int16));
        if (S.preroll.length > PREROLL_CHUNKS) S.preroll.shift();
        resumeFromPause();
      }
      return;
    }
    pump();
    maybeAutoPause();
    if (S.paused) return;
    const b64 = S.ptt ? int16ToBase64(int16) : null;
    for (const s of S.sessions) s.send(S.ptt === s.role ? b64 : SILENCE_B64);
  }
  function stopPlayback(){
    if (!S.ctx) return;
    let n = 0;
    for (const s of S.sessions) {
      n += s.q.length; s.q = [];
      for (const r of s.srcs.slice()) { try { r.src.stop(); n++; } catch {} }
    }
    S.nextPlay = S.playUntil = S.ctx.currentTime;
    if (n) dbg('sys', '[按住說話] 有人插話，停止播放中的翻譯');
  }
  function pttDown(role, btn, ev){
    if (!S.running) return;
    ev.preventDefault();
    try { btn.setPointerCapture(ev.pointerId); } catch {}
    S.ptt = role; S.lastVoice = performance.now();
    btn.classList.add('active');
    stopPlayback();
    setStatus(role === 'toOther' ? '收音中：我說話…（放開就翻譯）' : '收音中：對方說話…（放開就翻譯）', 'on');
  }
  function pttUp(btn){
    if (!S.ptt) return;
    S.ptt = null; S.lastVoice = performance.now();
    btn.classList.remove('active');
    setStatus('翻譯中…', 'on');
  }
  for (const [id, role] of [['pttMe', 'toOther'], ['pttThem', 'toMe']]) {
    const btn = $(id);
    btn.addEventListener('pointerdown', ev => pttDown(role, btn, ev));
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(t, () => pttUp(btn));
    btn.addEventListener('contextmenu', ev => ev.preventDefault());   // 長按不要跳出選單
  }
  function updatePttUi(){
    const show = S.running && S.pttMode;
    $('ptt').classList.toggle('show', show);
    $('pttMe').hidden = !S.sessions.some(s => s.role === 'toOther');
    $('pttThem').hidden = !S.sessions.some(s => s.role === 'toMe');
    for (const [id, who, lang] of [['pttMe', '按住：我說', S.langMe || el.langMe.value], ['pttThem', '按住：對方說', S.langOther || el.langOther.value]]) {
      const b = $(id); b.textContent = '';
      const big = document.createElement('b'); big.textContent = who;
      const small = document.createElement('small'); small.textContent = langName(lang);
      b.append(big, small);
    }
  }

  // 開麥克風串流，並監看系統中斷（iOS 切到背景、來電時常發生）
  async function openMicStream(){
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    const track = stream.getAudioTracks()[0];
    if (track) {
      const st = track.getSettings ? track.getSettings() : {};
      dbg('sys', '[手機] 麥克風：' + (track.label || '（無名稱）') + '，取樣率 ' + (st.sampleRate || '?')
        + '，回音消除 ' + st.echoCancellation + '，降噪 ' + st.noiseSuppression);
      track.onended = () => {
        dbg('err', '[手機] 麥克風被系統中斷（track ended）');
        if (S.running && document.visibilityState === 'visible') restartMic();
      };
      track.onmute = () => dbg('err', '[手機] 麥克風暫停（track muted，例如來電或切到背景）');
      track.onunmute = () => dbg('sys', '[手機] 麥克風恢復（track unmuted）');
    }
    return stream;
  }

  async function startMic(){
    S.stream = await openMicStream();
    S.source = S.ctx.createMediaStreamSource(S.stream);
    S.sink = S.ctx.createGain(); S.sink.gain.value = 0; S.sink.connect(S.ctx.destination);
    try {
      const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
      await S.ctx.audioWorklet.addModule(url);
      S.node = new AudioWorkletNode(S.ctx, 'down16k');
      S.node.port.onmessage = e => onChunk(e.data);
      S.micPath = 'AudioWorklet';
    } catch (err) {
      dbg('err', '[手機] AudioWorklet 不能用（' + (err && err.message || err) + '），改用 ScriptProcessor 備援');
      S.micPath = 'ScriptProcessor（備援）';
      // 舊瀏覽器備援：ScriptProcessor
      const ratio = S.ctx.sampleRate / 16000;
      let acc = 0, sum = 0, cnt = 0, out = new Int16Array(1600), n = 0;
      S.node = S.ctx.createScriptProcessor(4096, 1, 1);
      S.node.onaudioprocess = e => {
        const ch = e.inputBuffer.getChannelData(0);
        for (let i = 0; i < ch.length; i++) {
          sum += ch[i]; cnt++; acc += 1;
          if (acc >= ratio) {
            acc -= ratio;
            let v = Math.max(-1, Math.min(1, sum / cnt)); sum = 0; cnt = 0;
            out[n++] = v < 0 ? v * 32768 : v * 32767;
            if (n === out.length) { onChunk(out.slice(0)); n = 0; }
          }
        }
      };
    }
    S.source.connect(S.node);
    S.node.connect(S.sink);
    dbg('sys', '[手機] 收音方式：' + S.micPath + '；AudioContext ' + S.ctx.sampleRate + 'Hz，狀態 ' + S.ctx.state);
  }

  // 麥克風被系統斷掉時，只換麥克風串流；處理節點和翻譯連線都不動
  async function restartMic(){
    if (S.micRestarting || !S.running || !S.ctx || !S.node) return;
    S.micRestarting = true;
    try {
      try { S.source && S.source.disconnect(); } catch {}
      if (S.stream) S.stream.getTracks().forEach(t => t.stop());
      S.stream = await openMicStream();
      S.source = S.ctx.createMediaStreamSource(S.stream);
      S.source.connect(S.node);
      dbg('sys', '[手機] 麥克風已重新開啟');
      if (S.sessions.every(s => s.ready)) setStatus('聆聽中…請說話', 'on');
    } catch (err) {
      // iOS 可能要求使用者操作才能再開麥克風 → 等下一次點畫面
      setStatus('麥克風被系統關掉了，點一下畫面重新開啟', 'err');
      dbg('err', '[手機] 麥克風重新開啟失敗：' + (err && err.message || err));
      document.addEventListener('pointerdown', () => restartMic(), { once: true });
    } finally {
      S.micRestarting = false;
    }
  }

  // AudioContext 被系統暫停（iOS 切到背景、來電會變成 interrupted / suspended）→ 盡量恢復
  function resumeAudio(){
    if (!S.ctx || !S.running || S.ctx.state === 'running' || S.ctx.state === 'closed') return;
    S.ctx.resume().then(() => {
      if (S.ctx && S.ctx.state !== 'running') throw new Error(S.ctx.state);
    }).catch(() => {
      setStatus('聲音被系統暫停了，點一下畫面恢復', 'err');
      document.addEventListener('pointerdown', () => resumeAudio(), { once: true });
    });
  }

  // ---------- 開始 / 停止 ----------
  async function start(){
    const key = el.apiKey.value.trim();
    if (!key) { el.settings.classList.add('open'); setStatus('請先在設定貼上 API key', 'err'); el.apiKey.focus(); return; }
    if (el.langMe.value === el.langOther.value) { setStatus('兩邊語言不能一樣', 'err'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('這個瀏覽器無法使用麥克風（需要 HTTPS 網址）', 'err'); return;
    }
    store.set('key', key);
    el.settings.classList.remove('open');
    S.running = true;
    el.main.textContent = '停止'; el.main.classList.add('stop');
    setStatus('啟動中…');
    try {
      S.langMe = el.langMe.value; S.langOther = el.langOther.value;   // 這次口譯期間固定，判斷語言用
      S.ctx = new (window.AudioContext || window.webkitAudioContext)();
      await S.ctx.resume();
      const ctx = S.ctx;
      ctx.onstatechange = () => {
        dbg(ctx.state === 'running' ? 'sys' : 'err', '[手機] AudioContext 狀態 → ' + ctx.state);
        if (ctx === S.ctx && document.visibilityState === 'visible') resumeAudio();
      };
      dbg('sys', '[手機] ' + navigator.userAgent);
      if (navigator.audioSession) dbg('sys', '[手機] audioSession.type = ' + navigator.audioSession.type);
      S.nextPlay = 0; S.playUntil = 0; S.silentRun = 0; S.playOwner = null;
      S.waitLogged = false; S.lastVoice = 0; S.noise = 0;
      S.paused = false; S.preroll = []; S.lastOut = 0; S.startedAt = performance.now();
      S.pttMode = el.input.value === 'ptt'; S.ptt = null;
      await startMic();
    } catch (err) {
      setStatus('無法開啟麥克風：' + (err && err.message || err), 'err');
      stop(true); return;
    }
    const mode = el.mode.value;
    if (mode !== 'toMe') S.sessions.push(new Session('toOther', el.langOther.value));
    if (mode !== 'toOther') S.sessions.push(new Session('toMe', el.langMe.value));
    setStatus('連線中…');
    updatePttUi();
    requestWakeLock();
  }

  function stop(keepStatus){
    S.running = false;
    S.paused = false; S.preroll = [];
    for (const s of S.sessions) s.close();
    S.sessions = [];
    try { S.node && S.node.disconnect(); } catch {}
    try { S.source && S.source.disconnect(); } catch {}
    if (S.stream) S.stream.getTracks().forEach(t => t.stop());
    if (S.ctx) { S.ctx.close().catch(() => {}); }
    S.ctx = S.stream = S.source = S.node = S.sink = null;
    if (S.wakeLock) { S.wakeLock.release().catch(() => {}); S.wakeLock = null; }
    S.ptt = null;
    updatePttUi();
    el.main.textContent = '開始口譯'; el.main.classList.remove('stop');
    if (!keepStatus) setStatus('已停止');
  }

  async function requestWakeLock(){
    if (!('wakeLock' in navigator)) { dbg('err', '[手機] 這個瀏覽器不支援螢幕常亮（Wake Lock），螢幕可能會自動關掉'); return; }
    try {
      S.wakeLock = await navigator.wakeLock.request('screen');
      dbg('sys', '[手機] 螢幕常亮已啟用');
      S.wakeLock.addEventListener('release', () => dbg('sys', '[手機] 螢幕常亮被釋放'));
    } catch (err) {
      dbg('err', '[手機] 螢幕常亮啟用失敗：' + (err && err.message || err));
    }
  }
  // 切到背景再回來：重新要求螢幕常亮、恢復聲音、麥克風斷了就重開
  document.addEventListener('visibilitychange', () => {
    if (!S.running) return;
    if (document.visibilityState === 'hidden') { S.hiddenAt = performance.now(); dbg('sys', '[手機] 切到背景'); return; }
    const track = S.stream && S.stream.getAudioTracks()[0];
    dbg('sys', '[手機] 回到前景（離開 ' + Math.round((performance.now() - (S.hiddenAt || performance.now())) / 1000) + ' 秒）；AudioContext '
      + (S.ctx && S.ctx.state) + '，麥克風 ' + (track ? track.readyState + (track.muted ? '／muted' : '') : '無'));
    requestWakeLock();
    resumeAudio();
    if (!track || track.readyState === 'ended') restartMic();
  });

  el.main.onclick = () => (S.running ? stop() : start());

  // PWA：註冊 service worker（只快取 app 外殼，不碰 API），讓「加入主畫面」後可以直接開
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(err => dbg('err', '[PWA] service worker 註冊失敗：' + err.message));
  }
})();
</script>
</body>
</html>
